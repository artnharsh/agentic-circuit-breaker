[project]
name = "agentic-circuit-breaker"
version = "0.1.0"
description = "Detect and interrupt semantic thrashing loops in LangGraph multi-agent pipelines"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
keywords = ["langgraph", "circuit-breaker", "multi-agent", "thrashing", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Agent orchestration (peer dependency — user already has this)
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # Embeddings — local, free, no API keys needed
    "sentence-transformers>=3.0",
    # Math
    "numpy>=1.26",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_circuit_breaker"]

[tool.ruff]
line-length = 100
target-version = "py311"
