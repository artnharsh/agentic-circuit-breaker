[project]
name = "engine"
version = "0.1.0"
description = "Agentic Circuit Breaker — core engine service"
requires-python = ">=3.11"
dependencies = [
    # Agent orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    # API layer
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    # Config
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    # Embeddings (used Day 2, installed now)
    "sentence-transformers>=3.0",
    # Database
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    # Token counting
    "tiktoken>=0.7",
    # Utilities
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
